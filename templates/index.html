<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#17202a; --dim:#6b7684;
    --line:#e6e9ef; --accent:#1a73e8; --accent-soft:#e8f0fe;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{padding:44px 20px 8px;text-align:center}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:.2px}
  .sub{margin-top:8px;color:var(--dim);font-size:14px}

  .searchwrap{padding:24px 20px 6px;display:flex;justify-content:center}
  .searchbox{
    width:100%;max-width:660px;position:relative;
  }
  .searchbox input{
    width:100%;height:52px;border-radius:26px;border:1px solid var(--line);
    background:#fff;padding:0 48px 0 48px;font-size:16px;color:var(--ink);
    box-shadow:0 1px 6px rgba(32,33,36,.08);outline:none;transition:.16s;
  }
  .searchbox input:focus{border-color:#c9d6e8;box-shadow:0 2px 12px rgba(26,115,232,.18)}
  .searchbox .icon{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;opacity:.45;pointer-events:none;
  }
  .searchbox .clear{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--dim);font-size:18px;cursor:pointer;
    line-height:1;padding:6px;border-radius:50%;display:none;
  }
  .searchbox .clear:hover{background:#eef1f5}
  .searchbox.has-value .clear{display:block}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 20px 0;max-width:900px;margin:0 auto}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--dim);
    border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.14s;
  }
  .chip:hover{border-color:#cfd8e3;color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:#c6dafc;color:var(--accent);font-weight:600}

  .meta{max-width:1140px;margin:22px auto 0;padding:0 24px;color:var(--dim);font-size:13px}

  .grid{
    max-width:1140px;margin:14px auto 60px;padding:0 24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px;
  }
  .card{
    border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
    overflow:hidden;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;
    transition:transform .16s, box-shadow .16s, border-color .16s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(23,32,42,.10);border-color:#dfe4ec}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f5}
  .cap{padding:12px 14px 14px}
  .line1{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--dim)}
  .line1 .date{font-variant-numeric:tabular-nums}
  .line1 .place{
    color:var(--accent);background:var(--accent-soft);border-radius:6px;
    padding:1px 7px;font-weight:600;
  }
  .text{margin-top:7px;font-size:14px;line-height:1.5}
  .by{margin-top:9px;font-size:12.5px;color:var(--dim)}
  .empty{color:var(--dim);grid-column:1/-1;text-align:center;padding:40px 0}

  footer{
    border-top:1px solid var(--line);margin-top:20px;padding:22px 24px 44px;
    color:var(--dim);font-size:12.5px;text-align:center;line-height:1.8;
  }

  .lb{position:fixed;inset:0;background:rgba(12,17,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .lb[hidden]{display:none}
  .lbinner{background:#fff;border-radius:16px;max-width:960px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .lbinner img{width:100%;display:block;background:#eef1f5}
  .lbinfo{padding:16px 20px 20px}
  .lbinfo .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .lbinfo .d{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  .lbinfo .p{color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:7px;font-weight:600;font-size:13px}
  .lbinfo .c{margin-top:10px;font-size:15px;line-height:1.6}
  .lbinfo .a{margin-top:10px;color:var(--dim);font-size:13px}
  .lbclose{
    position:absolute;right:26px;top:22px;border:0;background:rgba(255,255,255,.9);
    width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;color:#17202a;
  }
  .lbstage{position:relative;background:#0c1118}
  .lbstage img{width:100%;display:block;max-height:68vh;object-fit:contain}
  .lbnav{
    position:absolute;top:50%;transform:translateY(-50%);border:0;cursor:pointer;display:none;
    width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.86);
    font-size:26px;line-height:1;color:#17202a;
  }
  .lbnav.prev{left:14px}
  .lbnav.next{right:14px}
  .lbstage.multi .lbnav{display:block}
  .lbcounter{
    position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;
    font-size:12.5px;padding:3px 10px;border-radius:999px;display:none;
  }
  .lbstage.multi .lbcounter{display:block}
  .lbstrip{display:flex;gap:8px;padding:12px 16px 2px;overflow-x:auto}
  .lbstrip:empty{display:none}
  .lbstrip img{
    width:76px;height:58px;object-fit:cover;border-radius:8px;cursor:pointer;
    border:2px solid transparent;opacity:.6;flex:0 0 auto;transition:.14s;
  }
  .lbstrip img:hover{opacity:.88}
  .lbstrip img.on{border-color:#1a73e8;opacity:1}
  .card{position:relative}
  .badge{
    position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;
    font-size:12px;padding:2px 8px;border-radius:999px;
  }
</style>
</head>
<body>

<header>
  <h1>__TITLE__</h1>
  <div class="sub">__SUBTITLE__</div>
</header>

<div class="searchwrap">
  <div class="searchbox" id="sbox">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
    </svg>
    <input id="q" type="search" autocomplete="off" placeholder="搜索日期、地名或关键词，例如：玄武湖 / 2024-05 / 爬坡">
    <button class="clear" id="clear" title="清空">×</button>
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"></div>

<footer>__NOTICE__<br>共 __COUNT__ 个作品 · 页面生成于 __BUILD_TIME__</footer>

<div class="lb" id="lb" hidden>
  <button class="lbclose" id="lbclose" title="关闭">×</button>
  <div class="lbinner">
    <div class="lbstage">
      <img id="lbimg" alt="">
      <button class="lbnav prev" id="lbprev" title="上一张">‹</button>
      <button class="lbnav next" id="lbnext" title="下一张">›</button>
      <div class="lbcounter" id="lbcounter"></div>
    </div>
    <div class="lbstrip" id="lbstrip"></div>
    <div class="lbinfo">
      <div class="t"><span class="d" id="lbdate"></span><span class="p" id="lbplace"></span></div>
      <div class="c" id="lbcaption"></div>
      <div class="a" id="lbauthor"></div>
    </div>
  </div>
</div>

<script>const POSTS = __POSTS_JSON__;</script>
<script>
(function(){
  const ALL = (POSTS.posts || []).filter(p => (p.status || 'published') === 'published');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  let query = '';

  function tokenize(s){ return String(s||'').toLowerCase().split(/\s+/).filter(Boolean); }

  function haystack(p){
    return [p.date, p.place, p.city, p.author, p.caption, (p.tags||[]).join(' ')]
      .map(v => String(v||'').toLowerCase()).join(' | ');
  }

  function match(p, tokens){
    if(!tokens.length) return true;
    const hay = haystack(p);
    const dateDigits = String(p.date||'').replace(/\D/g,'');
    return tokens.every(t => {
      const td = t.replace(/\D/g,'');
      return hay.indexOf(t) !== -1 || (td && dateDigits.indexOf(td) !== -1);
    });
  }

  function buildChips(){
    const years = {}, places = {};
    ALL.forEach(p => {
      const y = String(p.date||'').slice(0,4);
      if(y) years[y] = (years[y]||0)+1;
      if(p.place) places[p.place] = (places[p.place]||0)+1;
    });
    const topPlaces = Object.keys(places).sort((a,b)=>places[b]-places[a]).slice(0,6);
    const list = ['全部']
      .concat(Object.keys(years).sort().reverse())
      .concat(topPlaces);
    const box = $('chips'); box.innerHTML = '';
    list.forEach((label,i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i===0 && !query ? ' on' : '');
      b.textContent = label;
      b.dataset.val = i===0 ? '' : label;
      b.onclick = () => {
        query = b.dataset.val;
        $('q').value = query;
        syncSearchBox();
        refreshChips();
        render();
      };
      box.appendChild(b);
    });
  }

  function refreshChips(){
    document.querySelectorAll('.chip').forEach(c => {
      const v = c.dataset.val || '';
      c.classList.toggle('on', v === query);
    });
  }

  function syncSearchBox(){
    $('sbox').classList.toggle('has-value', !!$('q').value);
  }

  function render(){
    const tokens = tokenize(query);
    const list = ALL.filter(p => match(p, tokens))
                    .sort((a,b) => String(b.date).localeCompare(String(a.date)));
    const cnt = arr => arr.reduce((s,p) => s + ((p.photos && p.photos.length) || 1), 0);
    $('meta').textContent = '共 ' + ALL.length + ' 个作品 / ' + cnt(ALL) + ' 张照片' +
                            ' · 当前显示 ' + list.length + ' 个作品 / ' + cnt(list) + ' 张' +
                            (query ? ' · 关键词「' + query + '」' : '');
    const g = $('grid'); g.innerHTML = '';
    if(!list.length){
      g.innerHTML = '<p class="empty">没有匹配的照片，换个日期或地名试试。</p>';
      return;
    }
    list.forEach(p => {
      const card = document.createElement('button');
      card.className = 'card';
      const n = (p.photos && p.photos.length) || 1;
      card.innerHTML =
        '<img src="' + esc(p.thumb || p.photo) + '" alt="' + esc(p.place) + '" loading="lazy">' +
        (n > 1 ? '<span class="badge">' + n + ' 张</span>' : '') +
        '<div class="cap">' +
          '<div class="line1"><span class="date">' + esc(p.date) + '</span>' +
          '<span class="place">' + esc(p.place) + '</span></div>' +
          '<div class="text">' + esc(p.caption) + '</div>' +
          (p.author ? '<div class="by">@' + esc(p.author) + '</div>' : '') +
        '</div>';
      card.onclick = () => openLb(p);
      g.appendChild(card);
    });
  }

  let lbList = [], lbIdx = 0;

  function showLbPhoto(){
    const src = lbList[lbIdx];
    if(!src) return;
    $('lbimg').src = src;
    $('lbcounter').textContent = (lbIdx + 1) + ' / ' + lbList.length;
    document.querySelectorAll('#lbstrip img').forEach((el, i) => el.classList.toggle('on', i === lbIdx));
  }

  function openLb(p){
    lbList = (p.photos && p.photos.length) ? p.photos.slice() : [p.photo];
    lbIdx = 0;
    $('lbimg').alt = p.place || '';
    $('lbdate').textContent = p.date || '';
    $('lbplace').textContent = p.place || '';
    $('lbcaption').textContent = p.caption || '';
    $('lbauthor').textContent = p.author ? ('投稿：@' + p.author) : '';
    document.querySelector('.lbstage').classList.toggle('multi', lbList.length > 1);
    const strip = $('lbstrip');
    strip.innerHTML = '';
    if(lbList.length > 1){
      const thumbs = (p.thumbs && p.thumbs.length === lbList.length) ? p.thumbs : lbList;
      thumbs.forEach((t, i) => {
        const im = document.createElement('img');
        im.src = t; im.alt = '';
        im.onclick = () => { lbIdx = i; showLbPhoto(); };
        strip.appendChild(im);
      });
    }
    showLbPhoto();
    $('lb').hidden = false;
  }

  function stepLb(d){
    if(lbList.length < 2) return;
    lbIdx = (lbIdx + d + lbList.length) % lbList.length;
    showLbPhoto();
  }

  function closeLb(){
    $('lb').hidden = true;
    $('lbimg').src = '';
    $('lbstrip').innerHTML = '';
    lbList = [];
  }

  $('q').addEventListener('input', e => {
    query = e.target.value.trim();
    syncSearchBox(); refreshChips(); render();
  });
  $('clear').onclick = () => {
    $('q').value = ''; query = ''; syncSearchBox(); refreshChips(); render(); $('q').focus();
  };
  $('lbprev').onclick = () => stepLb(-1);
  $('lbnext').onclick = () => stepLb(1);
  $('lbclose').onclick = closeLb;
  $('lb').addEventListener('click', e => { if(e.target === $('lb')) closeLb(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ if(!$('lb').hidden) closeLb(); }
    if(!$('lb').hidden){
      if(e.key === 'ArrowLeft') stepLb(-1);
      if(e.key === 'ArrowRight') stepLb(1);
    }
    if(e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
  });

  // 支持可分享的搜索链接：index.html?q=玄武湖
  try {
    const q0 = new URLSearchParams(location.search).get('q');
    if (q0) { query = q0.trim(); $('q').value = query; }
  } catch (e) { /* file:// 下个别浏览器不支持，忽略即可 */ }

  buildChips();
  syncSearchBox();
  refreshChips();
  render();
})();
</script>
</body>
</html>
