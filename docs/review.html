<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核 · 骑行回忆录</title>
<link rel="stylesheet" href="app.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  .filters button{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
    font:inherit;font-size:13.5px;color:var(--dim);cursor:pointer;
  }
  .filters button.on{background:var(--accent-soft);border-color:#c6dafc;color:var(--accent);font-weight:600}
  .w{display:flex;gap:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px}
  .w img.cover{width:150px;height:112px;object-fit:cover;border-radius:10px;background:#eef1f5;cursor:pointer;flex:0 0 auto}
  .w .body{flex:1;min-width:0}
  .w .title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .w .date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .w .place{color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 9px;font-size:13px;font-weight:600}
  .w .cap{margin-top:8px;font-size:14.5px}
  .w .meta{margin-top:8px;color:var(--dim);font-size:12.5px;word-break:break-all;line-height:1.7}
  .w .acts{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap}
  .empty{color:var(--dim);text-align:center;padding:44px 0}
  .lb{position:fixed;inset:0;background:rgba(12,17,24,.75);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .lb[hidden]{display:none}
  .lbinner{background:#fff;border-radius:14px;max-width:940px;width:100%;max-height:92vh;overflow:auto}
  .lbinner img{width:100%;display:block;background:#eef1f5;max-height:70vh;object-fit:contain}
  .lbinner .strip{display:flex;gap:8px;padding:10px 14px;overflow-x:auto}
  .lbinner .strip img{width:74px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;border:2px solid transparent}
  .lbinner .strip img.on{opacity:1;border-color:var(--accent)}
  .lbclose{position:absolute;right:26px;top:22px;border:0;background:rgba(255,255,255,.9);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
  @media(max-width:560px){ .w{flex-direction:column} .w img.cover{width:100%;height:180px} }
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap">

  <div class="card" id="needAdmin" style="display:none">
    <h3>这一页需要管理员权限</h3>
    <p class="hint" id="why"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="login.html?next=review.html">去登录</a>
      <a class="btn ghost" href="diag.html">打开诊断页</a>
    </div>
  </div>

  <div id="main" style="display:none">
    <h1>审核</h1>
    <p class="lead">同学上传的作品会出现在这里。点「通过」后照片会移到公开目录，立刻出现在首页。</p>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="footer"><a href="index.html">回到首页</a></div>
</div>

<div class="lb" id="lb" hidden>
  <button class="lbclose" id="lbclose">×</button>
  <div class="lbinner">
    <img id="lbimg" alt="">
    <div class="strip" id="lbstrip"></div>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const show = (t, k) => { const m = $("msg"); m.textContent = t; m.className = "msg show " + (k || "info"); };
  const hide = () => { $("msg").className = "msg"; };

  let session = null, isAdmin = false;
  let all = [], filter = "pending";

  const LABEL = { pending: "待审", published: "已通过", rejected: "已驳回" };

  /* ---------- 存储对象移动：优先 move，失败退回 copy+remove ---------- */
  async function moveObj(from, to) {
    const b = sb.storage.from(APP_CONFIG.PHOTO_BUCKET);
    const r = await b.move(from, to);
    if (!r.error) return;
    const c = await b.copy(from, to);
    if (c.error) throw r.error;
    await b.remove([from]);
  }

  /* ---------- 通过 ---------- */
  async function approve(w) {
    const photos = w.photos || [];
    if (!photos.length) throw new Error("这个作品没有照片记录");
    const moved = [];
    for (let i = 0; i < photos.length; i++) {
      const from = photos[i];
      const ext = (from.split(".").pop() || "jpg").toLowerCase();
      const to = "published/" + w.id + "/" + (i + 1) + "." + ext;
      if (from.indexOf("published/") === 0) { moved.push(from); continue; }   // 已经在公开目录
      await moveObj(from, to);
      const tFrom = from.replace(/\/([^/]+)$/, "/thumb/$1");
      const tTo = "published/" + w.id + "/thumb/" + (i + 1) + "." + ext;
      try { await moveObj(tFrom, tTo); } catch (e) { console.warn("缩略图移动失败（可能不存在）", e); }
      moved.push(to);
    }
    const up = await sb.from("works").update({
      photos: moved,
      cover: moved[0],
      status: "published",
      reject_reason: null,
      reviewed_by: session.user.id,
      reviewed_at: new Date().toISOString()
    }).eq("id", w.id);
    if (up.error) throw up.error;
  }

  /* ---------- 驳回 / 退回 ---------- */
  async function setStatus(w, status, reason) {
    const up = await sb.from("works").update({
      status: status,
      reject_reason: reason || null,
      reviewed_by: session.user.id,
      reviewed_at: new Date().toISOString()
    }).eq("id", w.id);
    if (up.error) throw up.error;
  }

  /* ---------- 删除 ---------- */
  async function removeWork(w) {
    // 只删 Supabase 存储里的对象；仓库里的相对路径（photos/...）不是存储对象，跳过
    const all = (w.photos || []).concat((w.photos || []).map(p => p.replace(/\/([^/]+)$/, "/thumb/$1")));
    const remote = all.filter(function (x) { return x.indexOf("photos/") !== 0; });
    if (remote.length) {
      try {
        const rm = await withTimeout(sb.storage.from(APP_CONFIG.PHOTO_BUCKET).remove(remote), 30000, "删除文件");
        if (rm && rm.error) console.warn("部分存储文件删除失败（留孤儿文件，不影响显示）:", rm.error);
      } catch (e) { console.warn("存储删除超时/失败，继续删记录:", e); }
    }
    const d = await withTimeout(sb.from("works").delete().eq("id", w.id), 20000, "删除作品集");
    if (d.error) throw d.error;
  }

  /* ---------- 渲染 ---------- */
  function counts() {
    const c = { all: all.length, pending: 0, published: 0, rejected: 0 };
    all.forEach(w => { if (c[w.status] !== undefined) c[w.status]++; });
    return c;
  }

  function renderFilters() {
    const c = counts();
    const items = [
      ["pending", "待审 " + c.pending],
      ["published", "已通过 " + c.published],
      ["rejected", "已驳回 " + c.rejected],
      ["all", "全部 " + c.all]
    ];
    $("filters").innerHTML = "";
    items.forEach(function (it) {
      const b = document.createElement("button");
      b.textContent = it[1];
      if (filter === it[0]) b.className = "on";
      b.onclick = function () { filter = it[0]; renderFilters(); renderList(); };
      $("filters").appendChild(b);
    });
  }

  function renderList() {
    const list = all.filter(w => filter === "all" || w.status === filter);
    const box = $("list");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">' + (filter === "pending" ? "没有待审的作品" : "这里还没有内容") + "</p>";
      return;
    }
    list.forEach(function (w) {
      const el = document.createElement("div");
      el.className = "w";
      const cover = thumbUrl(w.cover || (w.photos || [])[0]);
      el.innerHTML =
        '<img class="cover" src="' + esc(cover) + '" alt="" onerror="this.src=\'' + esc(photoUrl(w.cover || (w.photos || [])[0])) + '\'">' +
        '<div class="body">' +
          '<div class="title">' +
            '<span class="date">' + esc(w.date || "无日期") + "</span>" +
            '<span class="place">' + esc(w.place || "") + "</span>" +
            '<span class="badge ' + esc(w.status) + '">' + (LABEL[w.status] || w.status) + "</span>" +
          "</div>" +
          (w.caption ? '<div class="cap">' + esc(w.caption) + "</div>" : "") +
          '<div class="meta">' +
            "照片 " + ((w.photos || []).length) + " 张" +
            (w.author_display ? " · 投稿：" + esc(w.author_display) : "") +
            "<br>上传者 id：" + esc(w.uploader || "?") +
            "<br>提交时间：" + esc((w.created_at || "").replace("T", " ").slice(0, 19)) +
            (w.reject_reason ? "<br>备注：" + esc(w.reject_reason) : "") +
          "</div>" +
        "</div>" +
        '<div class="acts"></div>';

      const acts = el.querySelector(".acts");
      const mk = (txt, cls, fn) => {
        const b = document.createElement("button");
        b.className = "btn small " + (cls || "");
        b.textContent = txt;
        b.onclick = async function () {
          b.disabled = true; const o = b.textContent; b.textContent = "处理中…";
          try { await fn(); await load(); }
          catch (err) { show(zhError(err && err.message ? err.message : err), "err"); b.disabled = false; b.textContent = o; }
        };
        acts.appendChild(b);
      };

      if (w.status === "pending") {
        mk("通过", "ok", () => approve(w));
        mk("驳回", "danger", () => {
          const r = prompt("驳回原因（会记在备注里，可留空）：", "内容不合适");
          if (r === null) return;
          return setStatus(w, "rejected", r);
        });
      } else if (w.status === "published") {
        mk("退回待审", "ghost", () => setStatus(w, "pending", "管理员退回"));
      } else {
        mk("重新待审", "ghost", () => setStatus(w, "pending", null));
      }
      mk("删除", "ghost", () => {
        if (!confirm("确定永久删除这个作品及其照片？不可恢复。")) return;
        return removeWork(w);
      });

      el.querySelector(".cover").onclick = () => openLb(w);
      box.appendChild(el);
    });
  }

  /* ---------- 灯箱 ---------- */
  let lbPhotos = [], lbIdx = 0;
  function showLb() {
    $("lbimg").src = photoUrl(lbPhotos[lbIdx]);
    document.querySelectorAll("#lbstrip img").forEach((el, i) => el.classList.toggle("on", i === lbIdx));
  }
  function openLb(w) {
    lbPhotos = w.photos || [];
    lbIdx = 0;
    const strip = $("lbstrip");
    strip.innerHTML = "";
    lbPhotos.forEach(function (p, i) {
      const im = document.createElement("img");
      im.src = thumbUrl(p);
      im.onerror = function () { this.src = photoUrl(p); };
      im.onclick = function () { lbIdx = i; showLb(); };
      strip.appendChild(im);
    });
    showLb();
    $("lb").hidden = false;
  }
  $("lbclose").onclick = () => { $("lb").hidden = true; };
  $("lb").addEventListener("click", e => { if (e.target === $("lb")) $("lb").hidden = true; });

  /* ---------- 加载 ---------- */
  async function load() {
    const r = await sb.from("works").select("*").order("created_at", { ascending: false }).limit(300);
    if (r.error) throw r.error;
    all = r.data || [];
    renderFilters();
    renderList();
  }

  /* ---------- 初始化 ---------- */
  (async function init() {
    try {
      const ctx = await renderTopbar("review");
      session = ctx && ctx.session;
      isAdmin = !!(ctx && ctx.isAdmin);

      if (!session) {
        $("why").textContent = "你没有登录。请先登录管理员账号。";
        $("needAdmin").style.display = "";
        return;
      }
      if (!isAdmin) {
        $("why").textContent = "已登录为 " + session.user.email +
          "，但这个账号还没有管理员标记。请在 Supabase 的 SQL Editor 里跑一次「设为管理员」的语句，然后刷新本页。";
        $("needAdmin").style.display = "";
        return;
      }
      $("main").style.display = "";
      await load();
    } catch (err) {
      $("needAdmin").style.display = "none";
      $("main").style.display = "";
      show("页面出错：" + (err && err.message ? err.message : err) + " —— 请打开 diag.html 截图给管理员。", "err");
    }
  })();
})();
</script>
</body>
</html>
