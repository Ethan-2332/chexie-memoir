<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://jttakspxfmyurdeccyul.supabase.co" crossorigin>

<title>河海大学自行车协会 · 骑行回忆录</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#17202a; --dim:#6b7684;
    --line:#e6e9ef; --accent:#1a73e8; --accent-soft:#e8f0fe;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{padding:40px 20px 6px;text-align:center}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:.2px}
  .sub{margin-top:8px;color:var(--dim);font-size:14px}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:#fff;border-bottom:1px solid var(--line);padding:11px 20px;font-size:14px;
  }
  .topbar .brand{font-weight:650;color:var(--ink);font-size:15px;text-decoration:none}
  .topbar .nav{display:flex;align-items:center;gap:14px}
  .topbar .nav a{color:var(--dim);text-decoration:none}
  .topbar .nav a.on{color:var(--accent);font-weight:600}
  .topbar .nav a:hover{color:var(--ink)}
  .topbar .who{color:var(--dim);font-size:13px}
  .topbar .tag{font-style:normal;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;font-size:12px}
  .topbar .linkbtn{border:0;background:none;color:var(--dim);cursor:pointer;font:inherit;font-size:13px;padding:4px 6px;border-radius:6px}
  .topbar .linkbtn:hover{background:#eef1f5;color:var(--ink)}
  .topbar .btn.small{background:var(--accent);color:#fff;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-block}

  .searchwrap{padding:22px 20px 6px;display:flex;justify-content:center}
  .searchbox{width:100%;max-width:660px;position:relative}
  .searchbox input{
    width:100%;height:52px;border-radius:26px;border:1px solid var(--line);
    background:#fff;padding:0 48px;font-size:16px;color:var(--ink);
    box-shadow:0 1px 6px rgba(32,33,36,.08);outline:none;transition:.16s;
  }
  .searchbox input:focus{border-color:#c9d6e8;box-shadow:0 2px 12px rgba(26,115,232,.18)}
  .searchbox .icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.45;pointer-events:none}
  .searchbox .clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;padding:6px;border-radius:50%;display:none}
  .searchbox .clear:hover{background:#eef1f5}
  .searchbox.has-value .clear{display:block}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 20px 0;max-width:900px;margin:0 auto}
  .chip{border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.14s}
  .chip:hover{border-color:#cfd8e3;color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:#c6dafc;color:var(--accent);font-weight:600}

  .meta{max-width:1140px;margin:22px auto 0;padding:0 24px;color:var(--dim);font-size:13px}

  .grid{max-width:1140px;margin:14px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
  .card{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);overflow:hidden;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .16s, box-shadow .16s, border-color .16s;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(23,32,42,.10);border-color:#dfe4ec}
  .card:active{transform:scale(.994);border-color:#c9d6e8}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f5}
  .cap{padding:12px 14px 14px}
  .line1{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--dim)}
  .line1 .date{font-variant-numeric:tabular-nums}
  .line1 .place{color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;font-weight:600}
  .text{margin-top:7px;font-size:14px;line-height:1.5}
  .by{margin-top:9px;font-size:12.5px;color:var(--dim)}
  .badge{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
  .thumb{position:relative}
  .addbtn{
    position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;
    border:0;background:rgba(255,255,255,.94);color:#1a73e8;font-size:21px;line-height:1;
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);
    display:flex;align-items:center;justify-content:center;padding:0 0 2px 0;transition:.15s;
  }
  .addbtn:hover{background:#fff;transform:scale(1.09)}
  .addbtn:active{transform:scale(.95)}

  .modal{position:fixed;inset:0;background:rgba(12,17,24,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal[hidden]{display:none}
  .mobox{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
  .mobox .mh{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
  .mobox .mb{padding:16px 18px}
  .mobox .mf{padding:0 18px 18px;display:flex;gap:9px;justify-content:flex-end}
  .mobox textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;outline:none;color:var(--ink);resize:vertical}
  .mobox .drop{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--dim);cursor:pointer;font-size:14px;background:#fbfcfe}
  .mobox .drop:hover,.mobox .drop.over{border-color:#a9c6ee;background:var(--accent-soft);color:var(--accent)}
  .mobox .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .mobox .thumbs img{width:78px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .mobox .mbtn{border:0;border-radius:9px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .mobox .mbtn.primary{background:var(--accent);color:#fff}
  .mobox .mbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .mobox .mbtn:disabled{opacity:.55;cursor:default}
  .mobox .mtip{color:var(--dim);font-size:12.5px;margin-top:12px;line-height:1.7}
  .mobox input[type=text],.mobox input[type=date]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font:inherit;font-size:14px;outline:none;color:var(--ink);background:#fff;
  }
  .mobox input:focus,.mobox textarea:focus{border-color:#c9d6e8;box-shadow:0 0 0 3px rgba(26,115,232,.12)}
  .mobox label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  .mobox .mb > label:first-child{margin-top:0}
  .mobox .frow{display:flex;gap:12px;flex-wrap:wrap}
  .mobox .frow > div{flex:1;min-width:140px}
  .empty{color:var(--dim);grid-column:1/-1;text-align:center;padding:40px 0;line-height:1.9}

  footer{border-top:1px solid var(--line);margin-top:20px;padding:22px 24px 44px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.8}

  .lb{position:fixed;inset:0;background:rgba(12,17,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .lb[hidden]{display:none}
  .lbinner{background:#fff;border-radius:16px;max-width:960px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .lbstage{position:relative;background:#0c1118}
  .lbstage img{width:100%;display:block;max-height:68vh;object-fit:contain}
  .lbnav{position:absolute;top:50%;transform:translateY(-50%);border:0;cursor:pointer;display:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.86);font-size:26px;line-height:1;color:#17202a}
  .lbnav.prev{left:14px}
  .lbnav.next{right:14px}
  .lbstage.multi .lbnav{display:block}
  .lbcounter{position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px;display:none}
  .lbstage.multi .lbcounter{display:block}
  .lbstrip{display:flex;gap:8px;padding:12px 16px 2px;overflow-x:auto}
  .lbstrip:empty{display:none}
  .lbstrip img{width:76px;height:58px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.6;flex:0 0 auto;transition:.14s}
  .lbstrip img:hover{opacity:.88}
  .lbstrip img.on{border-color:#1a73e8;opacity:1}
  .lbinfo{padding:16px 20px 20px}
  .lbinfo .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .lbinfo .d{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  .lbinfo .p{color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:7px;font-weight:600;font-size:13px}
  .lbinfo .c{margin-top:10px;font-size:15px;line-height:1.6}
  .lbinfo .a{margin-top:10px;color:var(--dim);font-size:13px}
  .lbclose{position:absolute;right:26px;top:22px;border:0;background:rgba(255,255,255,.9);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;color:#17202a}
  .lbtools{position:absolute;left:26px;top:22px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;max-width:62%}
  .lbtools button{
    border:0;cursor:pointer;padding:10px 16px;border-radius:9px;
    font:inherit;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.3);
  }
  .lbdel{background:rgba(217,48,37,.94);color:#fff}
  .lbdel:hover{background:#b3261e}
  .lbdelall{background:rgba(255,255,255,.94);color:#b3261e}
  .lbdelall:hover{background:#fff}
  .lbedit{background:rgba(255,255,255,.94);color:#1a73e8}
  .lbedit:hover{background:#fff}
</style>

<!-- 任何脚本错误都会在这里以红条显示，方便一眼看出问题 -->
<div id="_errbar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:9999;background:#a50e0e;color:#fff;font-size:13px;padding:10px 14px;line-height:1.6;word-break:break-all"></div>
<script>
(function () {
  var bar = document.getElementById("_errbar");
  function show(msg) {
    if (!bar) return;
    bar.style.display = "";
    bar.textContent = "页面出错（请把这一行截图发给管理员）：" + msg;
  }
  window.addEventListener("error", function (e) {
    show((e.message || e) + "  @" + String(e.filename || "").split("/").pop() + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("异步错误: " + ((r && r.message) || r));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.sb) { show("Supabase 库没加载成功（vendor/supabase.js）"); return; }
      var g = document.getElementById("grid");
      if (g && g.textContent.indexOf("正在加载") !== -1) {
        show("作品还在加载（已等 25 秒）。手机流量、校园网有时连不上数据库——"
           + "可以切到 WiFi 或换个网络再试，或者用系统浏览器打开（不要在微信/QQ 里点开）。");
      }
    }, 25000);
  });
})();
</script>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let ALL = [];
  let query = "";
  let viewer = null;      // {uid, isAdmin} —— 决定"删除照片"按钮给不给你看

  /* ---------- 把数据库记录整理成页面要的形状 ---------- */
  function normalize(w) {
    const raw = w.photos || [];
    const photos = raw.map(photoUrl);
    const thumbs = raw.map(thumbUrl);
    let coverIdx = raw.indexOf(w.cover);
    if (coverIdx < 0) coverIdx = 0;
    return {
      id: w.id,
      uploader: w.uploader || "",
      raw: raw,                       // 原始路径（删除时要用）
      date: w.date || "",
      place: w.place || "",
      city: w.city || "",
      author: w.author_display || "",
      caption: w.caption || "",
      tags: w.tags || [],
      photos: photos,
      thumbs: thumbs,
      coverThumb: thumbs[coverIdx] || "",
      coverFull: photos[coverIdx] || "",
      count: photos.length
    };
  }

  /* ---------- 搜索 ---------- */
  function tokenize(s) { return String(s || "").toLowerCase().split(/\s+/).filter(Boolean); }
  function haystack(p) {
    return [p.date, p.place, p.city, p.author, p.caption, (p.tags || []).join(" ")]
      .map(v => String(v || "").toLowerCase()).join(" | ");
  }
  function match(p, tokens) {
    if (!tokens.length) return true;
    const hay = haystack(p);
    const dateDigits = String(p.date || "").replace(/\D/g, "");
    return tokens.every(function (t) {
      const td = t.replace(/\D/g, "");
      return hay.indexOf(t) !== -1 || (td && dateDigits.indexOf(td) !== -1);
    });
  }

  /* ---------- 快捷标签 ---------- */
  function buildChips() {
    const years = {}, places = {};
    ALL.forEach(function (p) {
      const y = String(p.date || "").slice(0, 4);
      if (y) years[y] = (years[y] || 0) + 1;
      if (p.place) places[p.place] = (places[p.place] || 0) + 1;
    });
    const topPlaces = Object.keys(places).sort((a, b) => places[b] - places[a]).slice(0, 6);
    const list = ["全部"].concat(Object.keys(years).sort().reverse()).concat(topPlaces);
    const box = $("chips"); box.innerHTML = "";
    list.forEach(function (label, i) {
      const b = document.createElement("button");
      b.className = "chip" + (i === 0 && !query ? " on" : "");
      b.textContent = label;
      b.dataset.val = i === 0 ? "" : label;
      b.onclick = function () {
        query = b.dataset.val;
        $("q").value = query;
        syncSearchBox(); refreshChips(); render();
      };
      box.appendChild(b);
    });
  }
  function refreshChips() {
    document.querySelectorAll(".chip").forEach(function (c) {
      c.classList.toggle("on", (c.dataset.val || "") === query);
    });
  }
  function syncSearchBox() { $("sbox").classList.toggle("has-value", !!$("q").value); }

  /* ---------- 渲染 ---------- */
  function countPhotos(arr) { return arr.reduce((s, p) => s + (p.count || 1), 0); }

  function render() {
    const tokens = tokenize(query);
    const list = ALL.filter(p => match(p, tokens))
                    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
    $("meta").textContent = "共 " + ALL.length + " 个作品 / " + countPhotos(ALL) + " 张照片" +
                            " · 当前显示 " + list.length + " 个作品 / " + countPhotos(list) + " 张" +
                            (query ? " · 关键词「" + query + "」" : "");
    const g = $("grid"); g.innerHTML = "";
    if (!list.length) {
      g.innerHTML = '<p class="empty">' +
        (ALL.length ? "没有匹配的照片，换个日期或地名试试。"
                    : '还没有作品。<br>登录后到 <a href="upload.html">上传页</a> 提交第一个吧。') +
        "</p>";
      return;
    }
    list.forEach(function (p) {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.innerHTML =
        '<div class="thumb">' +
          '<img src="' + esc(p.coverThumb) + '" alt="' + esc(p.place) + '" loading="lazy">' +
          (p.count > 1 ? '<span class="badge">' + p.count + " 张 · 点开看</span>" : "") +
          '<button class="addbtn" type="button" title="把我的照片加进这个作品集">+</button>' +
        "</div>" +
        '<div class="cap">' +
          '<div class="line1"><span class="date">' + esc(p.date || "无日期") + "</span>" +
          (p.place ? '<span class="place">' + esc(p.place) + "</span>" : "") + "</div>" +
          (p.caption ? '<div class="text">' + esc(p.caption) + "</div>" : "") +
          (p.author ? '<div class="by">@' + esc(p.author) + "</div>" : "") +
        "</div>";
      const im = card.querySelector("img");
      im.onerror = function () { this.onerror = null; this.src = p.coverFull; };  // 缩略图缺失就退回大图
      card.onclick = () => openLb(p);
      card.querySelector(".addbtn").onclick = function (e) {
        e.stopPropagation();
        openReqModal(p);
      };
      g.appendChild(card);
    });
  }

  /* ---------- 灯箱 ---------- */
  let lbThumbs = [], lbFull = [], lbIdx = 0, lbCur = null;
  function showLbPhoto() {
    $("lbimg").src = lbFull[lbIdx];
    $("lbcounter").textContent = (lbIdx + 1) + " / " + lbThumbs.length;
    document.querySelectorAll("#lbstrip img").forEach((el, i) => el.classList.toggle("on", i === lbIdx));
  }
  function openLb(p) {
    lbThumbs = p.thumbs.length ? p.thumbs.slice() : [p.coverThumb];
    lbFull = p.photos.length ? p.photos.slice() : [p.coverFull];
    lbIdx = 0;
    $("lbimg").alt = p.place || "";
    $("lbdate").textContent = p.date || "";
    $("lbplace").textContent = p.place || "";
    $("lbcaption").textContent = p.caption || "";
    $("lbauthor").textContent = p.author ? ("投稿：@" + p.author) : "";
    document.querySelector(".lbstage").classList.toggle("multi", lbThumbs.length > 1);
    const strip = $("lbstrip"); strip.innerHTML = "";
    if (lbThumbs.length > 1) {
      lbThumbs.forEach(function (t, i) {
        const im = document.createElement("img");
        im.src = t; im.alt = "";
        im.onerror = function () { this.onerror = null; this.src = lbFull[i]; };
        im.onclick = function () { lbIdx = i; showLbPhoto(); };
        strip.appendChild(im);
      });
    }
    showLbPhoto();

    // 只有管理员能删：两个按钮放在灯箱左上角，一眼就能看到
    lbCur = p;
    syncLbTools();
    $("lbedit").onclick = function (e) { e.stopPropagation(); openEditModal(lbCur); };
    $("lbdel").onclick = function (e) { e.stopPropagation(); delPhoto(lbCur, lbIdx, $("lbdel")); };
    $("lbdelall").onclick = function (e) { e.stopPropagation(); delWork(lbCur, $("lbdelall")); };

    $("lb").hidden = false;
  }
  function stepLb(d) {
    if (lbThumbs.length < 2) return;
    lbIdx = (lbIdx + d + lbThumbs.length) % lbThumbs.length;
    showLbPhoto();
  }
  /* 灯箱左上角三个管理按钮的显隐（登录态拿到后可能还要再同步一次） */
  function syncLbTools() {
    const box = $("lbtools");
    if (!box) return;
    box.hidden = !(viewer && viewer.isAdmin && lbCur);
  }

  function closeLb() { $("lb").hidden = true; $("lbimg").src = ""; $("lbstrip").innerHTML = ""; lbThumbs = []; }

  /* ---------- 事件 ---------- */
  $("q").addEventListener("input", function (e) {
    query = e.target.value.trim();
    syncSearchBox(); refreshChips(); render();
  });
  $("clear").onclick = function () {
    $("q").value = ""; query = ""; syncSearchBox(); refreshChips(); render(); $("q").focus();
  };
  $("lbclose").onclick = closeLb;
  // 左右翻页按钮（之前漏了绑定，只有键盘左右键能用）
  $("lbprev").onclick = function (e) { e.stopPropagation(); stepLb(-1); };
  $("lbnext").onclick = function (e) { e.stopPropagation(); stepLb(1); };
  $("lb").addEventListener("click", e => { if (e.target === $("lb")) closeLb(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("lb").hidden) closeLb();
    if (!$("lb").hidden) {
      if (e.key === "ArrowLeft") stepLb(-1);
      if (e.key === "ArrowRight") stepLb(1);
    }
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  });

  /* ---------- 申请把自己的照片加进某个作品集 ---------- */
  let mqWork = null, mqPicked = [];

  async function toBlob(file, maxSide, quality) {
    let src;
    try { src = await createImageBitmap(file); }
    catch (e) {
      src = await new Promise(function (res, rej) {
        const im = new Image();
        im.onload = function () { res(im); }; im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
    }
    const w0 = src.width, h0 = src.height;
    const scale = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(src, 0, 0, w, h);
    if (src.close) { try { src.close(); } catch (e) {} }
    return await new Promise(function (r) { cv.toBlob(r, "image/jpeg", quality); });
  }

  function renderMqThumbs() {
    const box = $("mqThumbs");
    box.innerHTML = "";
    mqPicked.forEach(function (it, i) {
      const im = document.createElement("img");
      im.src = it.url;
      im.title = "点一下移除";
      im.style.cursor = "pointer";
      im.onclick = function () {
        URL.revokeObjectURL(it.url);
        mqPicked.splice(i, 1);
        renderMqThumbs();
      };
      box.appendChild(im);
    });
  }

  function openReqModal(p) {
    mqWork = p;
    mqPicked = [];
    $("mqPlace").textContent = p.place || "这个作品集";
    $("mqMsg").value = "";
    $("mqTip").style.color = "";
    $("mqTip").textContent = "提交后会通知作品集作者审核，通过后你的照片会出现在这个作品集里。";
    $("mqSubmit").disabled = false;
    $("mqSubmit").textContent = "提交申请";
    renderMqThumbs();
    $("reqModal").hidden = false;
  }

  function closeReqModal() {
    $("reqModal").hidden = true;
    mqPicked.forEach(function (x) { URL.revokeObjectURL(x.url); });
    mqPicked = []; mqWork = null;
  }

  function addMqFiles(list) {
    const arr = Array.prototype.slice.call(list).filter(function (f) { return /^image\//.test(f.type); });
    if (!arr.length) return;
    const room = 20 - mqPicked.length;
    arr.slice(0, room).forEach(function (f) { mqPicked.push({ file: f, url: URL.createObjectURL(f) }); });
    renderMqThumbs();
  }

  $("mqDrop").onclick = function () { $("mqFiles").click(); };
  $("mqFiles").onchange = function (e) { addMqFiles(e.target.files); e.target.value = ""; };
  ["dragenter", "dragover"].forEach(function (ev) {
    $("mqDrop").addEventListener(ev, function (e) { e.preventDefault(); $("mqDrop").classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    $("mqDrop").addEventListener(ev, function (e) { e.preventDefault(); $("mqDrop").classList.remove("over"); });
  });
  $("mqDrop").addEventListener("drop", function (e) { if (e.dataTransfer) addMqFiles(e.dataTransfer.files); });
  $("mqCancel").onclick = closeReqModal;
  $("reqModal").addEventListener("click", function (e) { if (e.target === $("reqModal")) closeReqModal(); });

  $("mqSubmit").onclick = async function () {
    const s = await getSession();
    if (!s) { location.href = "login.html?next=" + encodeURIComponent("index.html"); return; }
    if (!mqPicked.length) {
      $("mqTip").style.color = "var(--danger)";
      $("mqTip").textContent = "还没有选照片——先点上面的框选几张。";
      return;
    }
    const btn = $("mqSubmit");
    btn.disabled = true; btn.textContent = "上传中…";
    $("mqTip").style.color = "";
    try {
      const uid = s.user.id, stamp = Date.now(), paths = [];
      for (let i = 0; i < mqPicked.length; i++) {
        const name = "req-" + stamp + "-" + (i + 1) + ".jpg";
        const full = "pending/" + uid + "/" + name;
        const big = await toBlob(mqPicked[i].file, 1600, 0.82);
        let up = await sb.storage.from(APP_CONFIG.PHOTO_BUCKET).upload(full, big, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        const small = await toBlob(mqPicked[i].file, 600, 0.8);
        up = await sb.storage.from(APP_CONFIG.PHOTO_BUCKET).upload("pending/" + uid + "/thumb/" + name, small, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        paths.push(full);
        $("mqTip").textContent = "已上传 " + (i + 1) + " / " + mqPicked.length + " 张…";
      }
      const ins = await sb.from("photo_requests").insert({
        work_id: mqWork.id,
        requester: uid,
        message: $("mqMsg").value.trim() || null,
        photos: paths,
        status: "pending"
      });
      if (ins.error) throw ins.error;
      closeReqModal();
      alert("申请已提交！\n作品集作者审核通过后，你的照片就会出现在这个作品集里。");
    } catch (err) {
      $("mqTip").style.color = "var(--danger)";
      $("mqTip").textContent = "出错了：" + zhError(err && err.message ? err.message : err);
      btn.disabled = false; btn.textContent = "提交申请";
    }
  };

  /* ---------- 带超时的请求包装 ----------
     supabase-js 默认没有超时，网络一挂 promise 就永远不 settle，
     界面会一直卡在"删除中…"。这里强制给个上限。 */
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise(function (_, rej) {
        setTimeout(function () {
          rej(new Error((label || "请求") + "超时（" + Math.round(ms / 1000) + " 秒），可能是网络卡住了"));
        }, ms);
      })
    ]);
  }

  /* ---------- 删除单张照片（仅管理员）---------- */
  async function delPhoto(p, idx, btn) {
    const raw = (p.raw || [])[idx];
    if (!raw) { toast("找不到这张照片的路径", "err"); return; }
    if (!confirm("确定删除这张照片？删除后不可恢复。")) return;
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "删除中…";

    // 兜底：不管底层卡多久，25 秒后按钮一定恢复
    let done = false;
    const guard = setTimeout(function () {
      if (done) return;
      btn.disabled = false;
      btn.textContent = old;
      toast("等太久了 —— 请刷新页面确认照片是否已被删除", "err");
    }, 25000);

    try {
      // 先改数据库（保证列表与实际一致），再删存储文件
      const r = await withTimeout(
        sb.rpc("remove_work_photo", { p_work: p.id, p_path: raw }), 20000, "删除照片");
      if (r.error) throw r.error;

      try {
        const paths = [raw, raw.replace(/\/([^/]+)$/, "/thumb/$1")];
        const rm = await withTimeout(
          sb.storage.from(APP_CONFIG.PHOTO_BUCKET).remove(paths), 20000, "删除文件");
        if (rm && rm.error) console.warn("存储文件删除失败（只留个孤儿文件，不影响显示）:", rm.error);
      } catch (e2) {
        console.warn("存储文件删除超时/失败，忽略（数据库已更新）:", e2);
      }

      done = true; clearTimeout(guard);
      closeLb();
      await withTimeout(loadWorks(), 20000, "刷新列表");
      refreshChips();
      render();
      toast("已删除这张照片", "ok");
    } catch (err) {
      done = true; clearTimeout(guard);
      toast(zhError(err && err.message ? err.message : err), "err");
      btn.disabled = false; btn.textContent = old;
    }
  }

  /* ---------- 编辑作品集信息（仅管理员）---------- */
  let edWork = null;

  function openEditModal(p) {
    edWork = p;
    $("edDate").value = p.date || "";
    $("edPlace").value = p.place || "";
    $("edCaption").value = p.caption || "";
    $("edAuthor").value = p.author || "";
    $("edTags").value = (p.tags || []).join(", ");
    $("edTip").style.color = "";
    $("edTip").textContent = "改完点保存，首页立刻更新。照片本身不会被动到。";
    $("edSave").disabled = false;
    $("edSave").textContent = "保存";
    $("editModal").hidden = false;
    setTimeout(function () { try { $("edPlace").focus(); } catch (e) {} }, 50);
  }

  function closeEditModal() { $("editModal").hidden = true; edWork = null; }

  $("edCancel").onclick = closeEditModal;
  $("editModal").addEventListener("click", function (e) {
    if (e.target === $("editModal")) closeEditModal();
  });

  $("edSave").onclick = async function () {
    if (!edWork) return;
    const place = $("edPlace").value.trim();
    if (!place) {
      $("edTip").style.color = "var(--danger)";
      $("edTip").textContent = "地点不能为空 —— 它是首页显示和搜索的主要依据。";
      return;
    }
    const btn = $("edSave");
    btn.disabled = true; btn.textContent = "保存中…";
    try {
      const row = {
        date: $("edDate").value || null,
        place: place,
        caption: $("edCaption").value.trim() || null,
        author_display: $("edAuthor").value.trim() || null,
        tags: $("edTags").value.split(/[,，;；]/)
                 .map(function (s) { return s.trim(); }).filter(Boolean)
      };
      const r = await withTimeout(sb.from("works").update(row).eq("id", edWork.id), 20000, "保存");
      if (r.error) throw r.error;
      closeEditModal();
      await withTimeout(loadWorks(), 20000, "刷新列表");
      refreshChips();
      render();
      toast("作品集信息已更新", "ok");
    } catch (err) {
      $("edTip").style.color = "var(--danger)";
      $("edTip").textContent = "保存失败：" + zhError(err && err.message ? err.message : err);
      btn.disabled = false; btn.textContent = "保存";
    }
  };

  /* ---------- 删除整个作品集（仅管理员）---------- */
  async function delWork(p, btn) {
    const n = (p.raw || []).length;
    if (!confirm("确定删除整个作品集「" + (p.place || "") + "」？\n\n" +
                 (n ? "它的 " + n + " 张照片会一起删除，" : "") +
                 "首页立刻消失，不可恢复。")) return;

    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "删除中…";
    let done = false;
    const guard = setTimeout(function () {
      if (done) return;
      btn.disabled = false; btn.textContent = old;
      toast("等太久了 —— 请刷新页面确认作品集是否已被删除", "err");
    }, 45000);

    try {
      // 先删存储文件（尽力而为）：仓库里的相对路径（photos/...）不是存储对象，跳过
      try {
        const all = [];
        (p.raw || []).forEach(function (raw) {
          all.push(raw);
          all.push(raw.replace(/\/([^/]+)$/, "/thumb/$1"));
        });
        const remote = all.filter(function (x) { return x.indexOf("photos/") !== 0; });
        if (remote.length) {
          const rm = await withTimeout(
            sb.storage.from(APP_CONFIG.PHOTO_BUCKET).remove(remote), 30000, "删除文件");
          if (rm && rm.error) console.warn("部分存储文件删除失败（留孤儿文件，不影响显示）:", rm.error);
        }
      } catch (e2) {
        console.warn("存储删除超时/失败，继续删记录:", e2);
      }

      const d = await withTimeout(sb.from("works").delete().eq("id", p.id), 20000, "删除作品集");
      if (d.error) throw d.error;

      done = true; clearTimeout(guard);
      closeLb();
      await withTimeout(loadWorks(), 20000, "刷新列表");
      refreshChips();
      render();
      toast("整个作品集已删除", "ok");
    } catch (err) {
      done = true; clearTimeout(guard);
      toast(zhError(err && err.message ? err.message : err), "err");
      btn.disabled = false; btn.textContent = old;
    }
  }

  /* ---------- 加载作品列表（带自动重试）----------
     手机流量 / 校园网经常偶发连不上 Supabase，重试一两次往往就好了。 */
  async function loadWorks() {
    let lastErr = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await withTimeout(
          sb.from("works").select("*")
            .eq("status", "published")
            .order("date", { ascending: false })
            .order("created_at", { ascending: false })
            .limit(500),
          15000, "加载作品");
        if (r.error) throw r.error;
        ALL = (r.data || []).map(normalize);
        $("footCount").textContent = "共 " + ALL.length + " 个作品 · " + countPhotos(ALL) + " 张照片";
        return;
      } catch (e) {
        lastErr = e;
        console.warn("第 " + (attempt + 1) + " 次加载失败：", e && e.message ? e.message : e);
        if (attempt < 2) {
          $("grid").innerHTML = '<p class="empty">网络不太顺，正在重试（第 ' + (attempt + 2) + " 次）…</p>";
          await new Promise(function (res) { setTimeout(res, 1500 * (attempt + 1)); });
        }
      }
    }
    throw lastErr;
  }

  /* ---------- 启动 ---------- */
  (async function init() {
    // 顶栏与作品列表【并行】开始，互不等待
    // （原来是先 await 顶栏、再查作品，管理员白等 4 个网络来回）
    const topbarP = (async function () {
      try {
        const ctx = await renderTopbar("index");
        if (ctx && ctx.session) viewer = { uid: ctx.session.user.id, isAdmin: !!ctx.isAdmin };
        syncLbTools();        // 登录态可能比用户点开灯箱晚到，这里补一次
      } catch (e) { console.warn("顶栏渲染失败:", e); }
    })();

    try {
      const q0 = new URLSearchParams(location.search).get("q");
      if (q0) { query = q0.trim(); $("q").value = query; }
    } catch (e) {}

    try {
      await loadWorks();
    } catch (err) {
      $("grid").innerHTML =
        '<p class="empty">作品没能加载出来：' + esc(err && err.message ? err.message : err) +
        "<br><br>常见原因和办法：<br>" +
        "· 手机流量 / 校园网有时连不上数据库 → <b>切到 WiFi 或换个网络再试</b><br>" +
        "· 在微信、QQ 里点开的 → <b>用系统浏览器（Safari / Chrome）打开</b><br>" +
        "· 只是网络慢 → 多等一会儿<br><br>" +
        '<a href="javascript:location.reload()" style="font-weight:600">点这里重新加载</a>' +
        ' &nbsp;·&nbsp; <a href="diag.html">诊断页</a></p>';
      return;
    }

    buildChips();
    syncSearchBox();
    refreshChips();
    render();

    await topbarP;      // 只是收尾，不阻塞上面的渲染
  })();
})();
</script>
