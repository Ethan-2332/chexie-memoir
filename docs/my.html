<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的投稿 · 骑行回忆录</title>
<link rel="stylesheet" href="app.css">
<style>
  .item{display:flex;gap:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px}
  .item img.cover{width:140px;height:105px;object-fit:cover;border-radius:10px;background:#eef1f5;cursor:pointer;flex:0 0 auto}
  .item .body{flex:1;min-width:0}
  .item .title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .item .date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .item .place{color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 9px;font-size:13px;font-weight:600}
  .item .cap{margin-top:8px;font-size:14.5px}
  .item .meta{margin-top:8px;color:var(--dim);font-size:12.5px;line-height:1.7}
  .item .acts{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap}
  .empty{color:var(--dim);text-align:center;padding:44px 0;line-height:1.9}
  @media(max-width:560px){ .item{flex-direction:column} .item img.cover{width:100%;height:180px} }
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap">

  <div class="card" id="needLogin" style="display:none">
    <h3>需要先登录</h3>
    <p class="hint">登录后才能看到自己投过的稿。</p>
    <a class="btn" href="login.html?next=my.html">去登录 / 注册</a>
  </div>

  <div id="main" style="display:none">
    <h1>我的投稿</h1>
    <p class="lead">你提交过的作品和它们的审核状态。审核通过后会自动出现在首页。</p>
    <div style="margin-bottom:20px"><a class="btn" href="upload.html">再传一个作品</a></div>
    <div id="list"></div>

    <h2 style="margin:36px 0 8px;font-size:18px;font-weight:650">我申请加照片的记录</h2>
    <p class="hint" style="margin:0 0 14px">你在别人作品集右下角点「+」提交的申请，都显示在这里。</p>
    <div id="reqList"></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="footer"><a href="index.html">回到首页</a></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const show = (t, k) => { const m = $("msg"); m.textContent = t; m.className = "msg show " + (k || "info"); };
  const hide = () => { $("msg").className = "msg"; };

  let session = null;
  const LABEL = { pending: "待审核", published: "已通过", rejected: "已驳回" };

  async function withdraw(w) {
    // 先删照片，再删记录（顺序反了照片就找不到了）
    const paths = [];
    (w.photos || []).forEach(function (p) {
      paths.push(p);
      paths.push(p.replace(/\/([^/]+)$/, "/thumb/$1"));
    });
    if (paths.length) {
      const r = await sb.storage.from(APP_CONFIG.PHOTO_BUCKET).remove(paths);
      if (r.error) console.warn("照片删除失败（可能已不存在）:", r.error);
    }
    const d = await sb.from("works").delete().eq("id", w.id);
    if (d.error) throw d.error;
  }

  function render(list) {
    const box = $("list");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">你还没有投过稿。<br>' +
        '<a href="upload.html">点这里上传第一个作品</a></p>';
      return;
    }
    list.forEach(function (w) {
      const raw = w.photos || [];
      const coverRaw = w.cover || raw[0] || "";
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML =
        '<img class="cover" src="' + esc(thumbUrl(coverRaw)) + '" alt="">' +
        '<div class="body">' +
          '<div class="title">' +
            '<span class="date">' + esc(w.date || "无日期") + "</span>" +
            '<span class="place">' + esc(w.place || "") + "</span>" +
            '<span class="badge ' + esc(w.status) + '">' + (LABEL[w.status] || w.status) + "</span>" +
          "</div>" +
          (w.caption ? '<div class="cap">' + esc(w.caption) + "</div>" : "") +
          '<div class="meta">' +
            "照片 " + raw.length + " 张" +
            "<br>提交时间：" + esc(String(w.created_at || "").replace("T", " ").slice(0, 19)) +
            (w.reject_reason ? "<br>管理员备注：" + esc(w.reject_reason) : "") +
            (w.status === "pending" ? "<br>正在等管理员审核，通过后会出现在首页。" : "") +
          "</div>" +
        "</div>" +
        '<div class="acts"></div>';

      const im = el.querySelector("img.cover");
      im.onerror = function () { this.onerror = null; this.src = photoUrl(coverRaw); };
      im.onclick = function () { if (coverRaw) window.open(photoUrl(coverRaw), "_blank"); };

      const acts = el.querySelector(".acts");
      const isPub = w.status === "published";
      const s = document.createElement("span");
      s.className = "hint";
      s.textContent = isPub
        ? "已公开展示中。需要删除或修改，请联系协会管理员。"
        : (w.status === "pending"
            ? "正在等管理员审核。需要删除，请联系协会管理员。"
            : "这个作品没有通过审核。需要删除，请联系协会管理员。");
      acts.appendChild(s);

      box.appendChild(el);
    });
  }

  async function load() {
    const r = await sb.from("works").select("*")
      .eq("uploader", session.user.id)
      .order("created_at", { ascending: false })
      .limit(200);
    if (r.error) throw r.error;
    render(r.data || []);
  }

  /* ---------- 我申请加照片的记录 ---------- */
  const RLABEL = { pending: "待处理", approved: "已通过", rejected: "已驳回" };
  let works = {};

  async function withdrawReq(r) {
    const paths = [];
    (r.photos || []).forEach(function (p) {
      paths.push(p);
      paths.push(p.replace(/\/([^/]+)$/, "/thumb/$1"));
    });
    if (paths.length) {
      const rm = await sb.storage.from(APP_CONFIG.PHOTO_BUCKET).remove(paths);
      if (rm.error) console.warn("照片删除失败（可能已不存在）:", rm.error);
    }
    const d = await sb.from("photo_requests").delete().eq("id", r.id);
    if (d.error) throw d.error;
  }

  function renderReqs(list) {
    const box = $("reqList");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">还没有申请记录。<br>' +
        '在首页任意作品集右下角点「+」，就能申请把你的照片加进去。</p>';
      return;
    }
    list.forEach(function (r) {
      const w = works[r.work_id] || {};
      const coverRaw = w.cover || (w.photos || [])[0] || "";
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML =
        '<img class="cover" src="' + esc(thumbUrl(coverRaw)) + '" alt="">' +
        '<div class="body">' +
          '<div class="title">' +
            '<span class="date">申请加入</span>' +
            '<span class="place">' + esc(w.place || "（作品集暂不可见）") + "</span>" +
            '<span class="badge ' + esc(r.status) + '">' + (RLABEL[r.status] || r.status) + "</span>" +
          "</div>" +
          '<div class="meta">' +
            "申请加入 " + (r.photos || []).length + " 张照片" +
            "<br>提交时间：" + esc(String(r.created_at || "").replace("T", " ").slice(0, 19)) +
            (r.message ? "<br>我的留言：" + esc(r.message) : "") +
            (r.reject_reason ? "<br>对方备注：" + esc(r.reject_reason) : "") +
            (r.status === "pending" ? "<br>正在等待作品集作者或管理员处理。" : "") +
          "</div>" +
        "</div>" +
        '<div class="acts"></div>';

      const im = el.querySelector("img.cover");
      im.onerror = function () { this.onerror = null; this.src = photoUrl(coverRaw); };
      if (coverRaw) im.onclick = function () { window.open(photoUrl(coverRaw), "_blank"); };

      if (r.status === "pending") {
        const b = document.createElement("button");
        b.className = "btn small ghost";
        b.textContent = "撤回申请";
        b.onclick = async function () {
          if (!confirm("确定撤回这个申请？你上传的照片会一起删掉，不可恢复。")) return;
          b.disabled = true; b.textContent = "处理中…";
          try { await withdrawReq(r); await loadReqs(); }
          catch (err) {
            show(zhError(err && err.message ? err.message : err), "err");
            b.disabled = false; b.textContent = "撤回申请";
          }
        };
        el.querySelector(".acts").appendChild(b);
      }
      box.appendChild(el);
    });
  }

  async function loadReqs() {
    const r = await sb.from("photo_requests").select("*")
      .eq("requester", session.user.id)
      .order("created_at", { ascending: false })
      .limit(200);
    if (r.error) throw r.error;
    const list = r.data || [];
    const ids = Array.from(new Set(list.map(function (x) { return x.work_id; }).filter(Boolean)));
    works = {};
    if (ids.length) {
      const w = await sb.from("works").select("id,place,date,cover,photos").in("id", ids);
      if (!w.error) (w.data || []).forEach(function (x) { works[x.id] = x; });
      else console.warn("作品集信息读取失败:", w.error.message);
    }
    renderReqs(list);
  }

  (async function init() {
    try {
      const ctx = await renderTopbar("my");
      session = ctx && ctx.session;
      if (!session) { $("needLogin").style.display = ""; return; }
      $("main").style.display = "";
      await load();
      await loadReqs();
    } catch (err) {
      $("needLogin").style.display = "none";
      $("main").style.display = "";
      show("页面出错：" + (err && err.message ? err.message : err) + " —— 请打开 diag.html 截图给管理员。", "err");
    }
  })();
})();
</script>
</body>
</html>
