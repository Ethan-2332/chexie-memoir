<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://jttakspxfmyurdeccyul.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://jttakspxfmyurdeccyul.supabase.co">
<title>成员审核 · 骑行回忆录</title>
<link rel="stylesheet" href="app.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;color:var(--dim);cursor:pointer}
  .filters button.on{background:var(--accent-soft);border-color:#c6dafc;color:var(--accent);font-weight:600}
  .m{display:flex;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .m .av{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
         display:flex;align-items:center;justify-content:center;font-weight:650;font-size:18px;flex:0 0 auto}
  .m .body{flex:1;min-width:190px}
  .m .name{font-weight:600;font-size:15px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .m .mail{color:var(--dim);font-size:13px;margin-top:3px;word-break:break-all}
  .m .meta{color:var(--dim);font-size:12.5px;margin-top:3px}
  .m .acts{display:flex;gap:9px;flex-wrap:wrap}
  .empty{color:var(--dim);text-align:center;padding:44px 0;line-height:1.9}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap">

  <div class="card" id="needAdmin" style="display:none">
    <h3>这一页需要管理员权限</h3>
    <p class="hint" id="why"></p>
    <a class="btn" href="login.html?next=members.html">去登录</a>
  </div>

  <div id="main" style="display:none">
    <h1>成员与管理员</h1>
    <p class="lead">
      新注册的同学会出现在这里——点「通过」之后他才能上传照片。<br>
      点「设为管理员」可以把权限交给他（能审核、删除、修改）；随时点「取消管理员」收回。
    </p>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="footer"><a href="index.html">回到首页</a></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const show = (t, k) => { const m = $("msg"); m.textContent = t; m.className = "msg show " + (k || "info"); };

  let session = null, isAdmin = false;
  let all = [], filter = "pending";
  const LABEL = { pending: "待审核", approved: "已通过", rejected: "已拒绝" };

  async function review(p, status, reason) {
    const r = await sb.rpc("review_member", { p_user: p.id, p_status: status, p_reason: reason || null });
    if (r.error) throw r.error;
  }

  async function setAdmin(p, yes) {
    const name = p.display_name || p.email || "这个账号";
    if (yes) {
      if (!confirm("把「" + name + "」设为管理员？\n\n" +
                   "他将能审核作品和成员、处理加照片申请、删除和修改内容——权限和你一样。")) return false;
    } else {
      if (!confirm("取消「" + name + "」的管理员身份？\n\n" +
                   "他将变回普通成员：能上传和浏览，但不能再审核、删除或修改别人的内容。")) return false;
    }
    const r = await sb.rpc("set_admin", { p_user: p.id, p_is_admin: yes });
    if (r.error) throw r.error;
    return true;
  }

  function renderFilters() {
    const c = { pending: 0, approved: 0, rejected: 0 };
    all.forEach(p => { if (c[p.status] !== undefined) c[p.status]++; });
    const admins = all.filter(p => p.is_admin).length;
    const items = [
      ["pending", "待审核 " + c.pending],
      ["approved", "已通过 " + c.approved],
      ["rejected", "已拒绝 " + c.rejected],
      ["admin", "管理员 " + admins],
      ["all", "全部 " + all.length]
    ];
    $("filters").innerHTML = "";
    items.forEach(function (it) {
      const b = document.createElement("button");
      b.textContent = it[1];
      if (filter === it[0]) b.className = "on";
      b.onclick = function () { filter = it[0]; renderFilters(); renderList(); };
      $("filters").appendChild(b);
    });
  }

  function renderList() {
    const list = all.filter(function (p) {
      if (filter === "all") return true;
      if (filter === "admin") return !!p.is_admin;
      return p.status === filter;
    });
    const box = $("list");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">' +
        (filter === "pending" ? "没有等待审核的新成员。" : "这里还没有内容") + "</p>";
      return;
    }
    list.forEach(function (p) {
      const name = p.display_name || "(没填昵称)";
      const el = document.createElement("div");
      el.className = "m";
      el.innerHTML =
        '<div class="av">' + esc(String(name).slice(0, 1)) + "</div>" +
        '<div class="body">' +
          '<div class="name">' + esc(name) +
            '<span class="badge ' + esc(p.status) + '">' + (LABEL[p.status] || p.status) + "</span>" +
            (p.is_admin ? '<em style="font-style:normal;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:12px">管理员</em>' : "") +
          "</div>" +
          '<div class="mail">' + esc(p.email || "（邮箱未知）") + "</div>" +
          '<div class="meta">注册时间：' + esc(String(p.created_at || "").replace("T", " ").slice(0, 19)) +
            (p.id === (session && session.user.id) ? " · <b>这是你自己</b>" : "") +
            (p.status_reason ? "<br>备注：" + esc(p.status_reason) : "") +
          "</div>" +
        "</div>" +
        '<div class="acts"></div>';

      const acts = el.querySelector(".acts");
      const mk = function (txt, cls, fn) {
        const b = document.createElement("button");
        b.className = "btn small " + (cls || "");
        b.textContent = txt;
        b.onclick = async function () {
          b.disabled = true; const o = b.textContent; b.textContent = "处理中…";
          try { const ok = await fn(); if (ok !== false) await load(); }
          catch (err) { show(zhError(err && err.message ? err.message : err), "err"); b.disabled = false; b.textContent = o; }
        };
        acts.appendChild(b);
      };

      const isMe = p.id === (session && session.user.id);
      if (isMe) {
        const s = document.createElement("span");
        s.className = "hint";
        s.textContent = "这是你自己（不能审核或降级自己）";
        acts.appendChild(s);
      } else {
        if (p.status === "pending") {
          mk("通过", "ok", () => review(p, "approved", null));
          mk("拒绝", "danger", () => {
            const r = prompt("拒绝原因（申请人看不到具体界面，仅供你自己记录，可留空）：", "");
            if (r === null) return false;
            return review(p, "rejected", r);
          });
        } else if (p.status === "approved") {
          mk("取消通过", "ghost", () => {
            if (!confirm("取消后，这个账号将不能再上传照片（已上传的内容不受影响）。确定？")) return false;
            return review(p, "pending", "管理员取消了通过");
          });
        } else {
          mk("改为通过", "ok", () => review(p, "approved", null));
        }

        // 管理员开关
        if (p.is_admin) {
          mk("取消管理员", "ghost", () => setAdmin(p, false));
        } else {
          mk("设为管理员", "ghost", () => setAdmin(p, true));
        }
      }

      box.appendChild(el);
    });
  }

  async function load() {
    const r = await sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(500);
    if (r.error) throw r.error;
    all = r.data || [];
    renderFilters();
    renderList();
  }

  (async function init() {
    try {
      const ctx = await renderTopbar("members");
      session = ctx && ctx.session;
      isAdmin = !!(ctx && ctx.isAdmin);
      if (!session) {
        $("why").textContent = "你没有登录。请先登录管理员账号。";
        $("needAdmin").style.display = "";
        return;
      }
      if (!isAdmin) {
        $("why").textContent = "已登录为 " + session.user.email + "，但这个账号不是管理员。";
        $("needAdmin").style.display = "";
        return;
      }
      $("main").style.display = "";
      await load();
    } catch (err) {
      $("needAdmin").style.display = "none";
      $("main").style.display = "";
      show("页面出错：" + (err && err.message ? err.message : err) +
           " —— 如果提示缺少 status 字段，说明「补丁 03」还没在数据库里跑过。", "err");
    }
  })();
})();
</script>
</body>
</html>
