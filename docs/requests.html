<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://jttakspxfmyurdeccyul.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://jttakspxfmyurdeccyul.supabase.co">
<title>申请审核 · 骑行回忆录</title>
<link rel="stylesheet" href="app.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;color:var(--dim);cursor:pointer}
  .filters button.on{background:var(--accent-soft);border-color:#c6dafc;color:var(--accent);font-weight:600}
  .r{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:16px;overflow:hidden}
  .r .head{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .r .head img.w{width:96px;height:72px;object-fit:cover;border-radius:8px;background:#eef1f5;flex:0 0 auto}
  .r .head .info{flex:1;min-width:180px}
  .r .head .info .line1{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .r .head .info .place{color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 9px;font-size:13px;font-weight:600}
  .r .body{padding:14px 16px}
  .r .msg{font-size:14.5px;line-height:1.6;margin-bottom:12px}
  .r .msg.empty{color:var(--dim);font-size:13.5px}
  .strip{display:flex;gap:8px;flex-wrap:wrap}
  .strip img{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#eef1f5}
  .r .meta{color:var(--dim);font-size:12.5px;margin-top:12px;line-height:1.7}
  .r .acts{display:flex;gap:9px;flex-wrap:wrap;padding:0 16px 16px}
  .empty{color:var(--dim);text-align:center;padding:44px 0;line-height:1.9}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap">

  <div class="card" id="needLogin" style="display:none">
    <h3>需要先登录</h3>
    <p class="hint" id="why">登录后才能审核别人申请加进你作品集的照片。</p>
    <a class="btn" href="login.html?next=requests.html">去登录</a>
  </div>

  <div id="main" style="display:none">
    <h1>加照片申请</h1>
    <p class="lead">同学申请把他们的照片加进你创建的作品集。通过后照片会并入那个作品集，立刻在首页显示。</p>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="footer"><a href="index.html">回到首页</a></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const show = (t, k) => { const m = $("msg"); m.textContent = t; m.className = "msg show " + (k || "info"); };
  const hide = () => { $("msg").className = "msg"; };

  let session = null, isAdmin = false;
  let reqs = [], works = {}, filter = "pending";
  const LABEL = { pending: "待处理", approved: "已通过", rejected: "已驳回" };

  async function approve(r) {
    const res = await sb.rpc("approve_photo_request", { p_request: r.id });
    if (res.error) throw res.error;
  }
  async function reject(r) {
    const reason = prompt("驳回原因（会显示给申请人，可留空）：", "照片与这个作品集的主题不符");
    if (reason === null) return false;
    const up = await sb.from("photo_requests").update({
      status: "rejected",
      reject_reason: reason || null,
      reviewed_by: session.user.id,
      reviewed_at: new Date().toISOString()
    }).eq("id", r.id);
    if (up.error) throw up.error;
    return true;
  }

  function renderFilters() {
    const c = { pending: 0, approved: 0, rejected: 0 };
    reqs.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
    const items = [
      ["pending", "待处理 " + c.pending],
      ["approved", "已通过 " + c.approved],
      ["rejected", "已驳回 " + c.rejected],
      ["all", "全部 " + reqs.length]
    ];
    $("filters").innerHTML = "";
    items.forEach(function (it) {
      const b = document.createElement("button");
      b.textContent = it[1];
      if (filter === it[0]) b.className = "on";
      b.onclick = function () { filter = it[0]; renderFilters(); renderList(); };
      $("filters").appendChild(b);
    });
  }

  function renderList() {
    const list = reqs.filter(r => filter === "all" || r.status === filter);
    const box = $("list");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">' +
        (filter === "pending" ? "没有待处理的申请。<br>同学在首页作品集右下角点「+」就能申请加照片。"
                              : "这里还没有内容") + "</p>";
      return;
    }
    list.forEach(function (r) {
      const w = works[r.work_id] || {};
      const el = document.createElement("div");
      el.className = "r";
      const coverRaw = w.cover || (w.photos || [])[0] || "";
      el.innerHTML =
        '<div class="head">' +
          '<img class="w" src="' + esc(thumbUrl(coverRaw)) + '" alt="">' +
          '<div class="info">' +
            '<div class="line1">' +
              '<span>申请加入</span>' +
              '<span class="place">' + esc(w.place || "(作品集已删除)") + "</span>" +
              (w.date ? "<span>" + esc(w.date) + "</span>" : "") +
              '<span class="badge ' + esc(r.status) + '">' + (LABEL[r.status] || r.status) + "</span>" +
            "</div>" +
            '<div style="margin-top:6px;font-size:13px;color:var(--dim)">申请人：' +
              esc((r.requester || "").slice(0, 8)) + "… · " +
              esc(String(r.created_at || "").replace("T", " ").slice(0, 16)) + "</div>" +
          "</div>" +
        "</div>" +
        '<div class="body">' +
          (r.message ? '<div class="msg">' + esc(r.message) + "</div>"
                     : '<div class="msg empty">（申请人没有留言）</div>') +
          '<div class="strip"></div>' +
          '<div class="meta">申请加入 ' + (r.photos || []).length + " 张照片" +
            '<br>作品集当前 ' + ((w.photos || []).length) + " 张" +
            (r.reject_reason ? "<br>驳回原因：" + esc(r.reject_reason) : "") +
          "</div>" +
        "</div>" +
        '<div class="acts"></div>';

      const img0 = el.querySelector("img.w");
      img0.onerror = function () { this.onerror = null; this.src = photoUrl(coverRaw); };

      const strip = el.querySelector(".strip");
      (r.photos || []).forEach(function (p) {
        const im = document.createElement("img");
        im.src = thumbUrl(p);
        im.onerror = function () { this.onerror = null; this.src = photoUrl(p); };
        im.onclick = function () { window.open(photoUrl(p), "_blank"); };
        strip.appendChild(im);
      });

      const acts = el.querySelector(".acts");
      const mk = (txt, cls, fn) => {
        const b = document.createElement("button");
        b.className = "btn small " + (cls || "");
        b.textContent = txt;
        b.onclick = async function () {
          b.disabled = true; const o = b.textContent; b.textContent = "处理中…";
          try { const ok = await fn(); if (ok !== false) await load(); }
          catch (err) { show(zhError(err && err.message ? err.message : err), "err"); }
          b.disabled = false; b.textContent = o;
        };
        acts.appendChild(b);
      };

      if (r.status === "pending") {
        mk("通过，并入作品集", "ok", () => approve(r));
        mk("驳回", "danger", () => reject(r));
      } else if (r.status === "approved") {
        const s = document.createElement("span");
        s.className = "hint";
        s.textContent = "已并入作品集。撤销并入需要改作品集，请到「审核」页或联系管理员。";
        acts.appendChild(s);
      } else {
        const s = document.createElement("span");
        s.className = "hint";
        s.textContent = "已驳回。" + (r.reject_reason ? "原因：" + r.reject_reason : "");
        acts.appendChild(s);
      }

      box.appendChild(el);
    });
  }

  async function load() {
    const r = await sb.from("photo_requests").select("*")
      .order("created_at", { ascending: false }).limit(300);
    if (r.error) throw r.error;
    // 只显示"别人提的"——自己的申请不用自己审
    reqs = (r.data || []).filter(x => x.requester !== session.user.id);

    const ids = Array.from(new Set(reqs.map(x => x.work_id).filter(Boolean)));
    works = {};
    if (ids.length) {
      const w = await sb.from("works").select("id,place,date,cover,photos").in("id", ids);
      if (!w.error) (w.data || []).forEach(x => { works[x.id] = x; });
      else console.warn("作品集信息读取失败:", w.error.message);
    }
    renderFilters();
    renderList();
  }

  (async function init() {
    try {
      const ctx = await renderTopbar("requests");
      session = ctx && ctx.session;
      isAdmin = !!(ctx && ctx.isAdmin);
      if (!session) { $("needLogin").style.display = ""; return; }
      $("main").style.display = "";
      await load();
    } catch (err) {
      $("needLogin").style.display = "none";
      $("main").style.display = "";
      show("页面出错：" + (err && err.message ? err.message : err) +
           " —— 如果提示缺少 photo_requests，说明「补丁 02」还没在数据库里跑过。", "err");
    }
  })();
})();
</script>
</body>
</html>
